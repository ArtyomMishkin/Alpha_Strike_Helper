<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лэнсы - Alpha Strike Helper</title>
    <link rel="stylesheet" href="/static/main.css">
    <style>
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-primary { background: #2196F3; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .btn-primary:hover { background: #1976D2; }
        .lances-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .lance-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .lance-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #333; }
        .lance-info { margin-bottom: 15px; color: #666; }
        .lance-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-small { padding: 8px 12px; font-size: 14px; }
        .btn-danger { background: #f44336; color: white; border: none; padding: 6px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; }
        .btn-danger:hover { background: #da190b; }
        .empty-state { text-align: center; color: #999; padding: 30px; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fefefe; margin: 5% auto; padding: 20px; border: 1px solid #888; width: 90%; max-width: 600px; border-radius: 8px; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: black; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        input:focus, textarea:focus { outline: none; border-color: #2196F3; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">⚔️ Alpha Strike Helper</h1>
            <ul class="nav-menu">
                <li><a href="/">Главная</a></li>
                <li><a href="/cards">Карты</a></li>
                <li><a href="/collections">Коллекции</a></li>
                <li><a href="/lances" class="active">Лэнсы</a></li>
                <li><a href="/stars">Звёзды</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>⚔️ Мои Лэнсы</h1>
            <button class="btn-primary" onclick="openCreateLanceModal()">+ Создать лэнс</button>
        </div>

        <div id="lancesContainer" class="lances-grid">
            <!-- Лэнсы будут загружены здесь -->
        </div>
    </div>

    <!-- Modal для создания лэнса -->
    <div id="createLanceModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCreateLanceModal()">&times;</span>
            <h2>Создать лэнс</h2>
            <div class="form-group">
                <label>Название:</label>
                <input type="text" id="lanceName" placeholder="Название лэнса">
            </div>
            <div class="form-group">
                <label>Описание:</label>
                <textarea id="lanceDescription" placeholder="Описание"></textarea>
            </div>
            <button class="btn-primary" onclick="createLance()" style="width: 100%;">Создать</button>
        </div>
    </div>

    <script>
        const API = 'http://localhost:8080/api/v1';

        async function loadLances() {
    try {
        const response = await fetch(`${API}/lances`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const lances = await response.json();
        const container = document.getElementById('lances-container');
        if (!lances || lances.length === 0) {
            container.innerHTML = '<div class="empty-state">Нет лэнсов</div>';
            return;
        }
        container.innerHTML = lances.map(lance => `
            <div class="card">
                <h3>${lance.name}</h3>
                <p>${lance.description || ''}</p>
                <small style="color: #999;">
                    ID: ${lance.id} | 
                    ${lance.members ? lance.members.length : 0}/4 мехов | 
                    <a href="${API}/lances/${lance.id}/export" download="lance-${lance.name}.json" 
                       class="btn btn-secondary" style="padding: 4px 8px; font-size: 12px;">📄 PDF</a>
                </small>
                <div class="card-actions" style="margin-top: 10px;">
                    <button class="btn" onclick="editLance(${lance.id})">Редактировать</button>
                    <button class="btn btn-danger" onclick="deleteLance(${lance.id})">Удалить</button>
                </div>
            </div>
        `).join('');
    } catch (error) {
        document.getElementById('lances-container').innerHTML = 
            `<div class="empty-state">Ошибка: ${error.message}</div>`;
    }
}

function addMechToLance() {
    const mechId = document.getElementById('lance-mech-select').value;
    if (!mechId) return alert('Выберите мех');
    if (lanceMembers.length >= 4) return alert('Максимум 4 меха!');
    const mech = allMechs.find(m => m.id == mechId);
    if (!mech) return alert('Мех не найден');
    if (lanceMembers.find(m => m.id == mech.id)) return alert('Мех уже добавлен');
    lanceMembers.push({...mech, position: lanceMembers.length + 1});
    document.getElementById('lance-mech-select').value = '';
    updateLanceMembersList();
}

function updateLanceMembersList() {
    const list = document.getElementById('lance-members-list');
    if (lanceMembers.length === 0) {
        list.innerHTML = '<p style="color: #999; margin: 0;">Добавьте минимум 3 меха</p>';
        return;
    }
    list.innerHTML = lanceMembers.map((member, idx) => `
        <div class="member-item">
            <div>
                <div class="member-name">${member.name}</div>
                <div class="member-type">
                    ${member.type || '-'} | PV: ${member.pointvalue || member.pv || '-'} | 
                    Позиция: ${member.position || idx + 1}
                </div>
            </div>
            <button class="btn btn-danger" onclick="removeMechFromLance(${idx})">×</button>
        </div>
    `).join('');
}

async function editLance(id) {
    try {
        const response = await fetch(`${API}/lances/${id}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const lance = await response.json();
        currentLanceId = id;
        lanceMembers = (lance.members || []).map((m, idx) => ({
            ...m.card || m,  // поддержка разных форматов
            position: m.position || idx + 1
        }));
        
        document.getElementById('lances-modal-title').textContent = `Редактировать: ${lance.name}`;
        document.getElementById('lance-name').value = lance.name;
        document.getElementById('lance-description').value = lance.description || '';
        document.getElementById('lance-save-btn').textContent = 'Сохранить';
        updateLanceMembersList();
        document.getElementById('lancesModal').classList.add('active');
    } catch (error) {
        alert('Ошибка загрузки: ' + error.message);
    }
}

        async function createLance() {
            const name = document.getElementById('lanceName').value;
            const description = document.getElementById('lanceDescription').value;

            if (!name) {
                alert('Введите название лэнса');
                return;
            }

            try {
                console.log('📝 Creating lance:', name);
                const response = await fetch(`${API}/lances`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description })
                });

                if (response.ok) {
                    const result = await response.json();
                    console.log('✅ Lance created:', result);
                    alert('✅ Лэнс создан!');
                    closeCreateLanceModal();
                    loadLances();
                } else {
                    const error = await response.text();
                    console.error('❌ Error response:', error);
                    alert('❌ Ошибка: ' + error);
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('❌ Ошибка: ' + error.message);
            }
        }

        async function deleteLance(id) {
            if (!confirm('Удалить лэнс?')) return;
            
            try {
                const response = await fetch(`${API}/lances/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    alert('✅ Лэнс удалён!');
                    loadLances();
                } else {
                    alert('❌ Ошибка при удалении (HTTP ' + response.status + ')');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('❌ Ошибка: ' + error.message);
            }
        }

        function viewLance(id) {
            alert('Лэнс #' + id + '\n\nДополнительные функции будут добавлены позже');
        }

        function openCreateLanceModal() {
            document.getElementById('createLanceModal').style.display = 'block';
        }

        function closeCreateLanceModal() {
            document.getElementById('createLanceModal').style.display = 'none';
            document.getElementById('lanceName').value = '';
            document.getElementById('lanceDescription').value = '';
        }

        window.onclick = function(event) {
            let modal = document.getElementById('createLanceModal');
            if (event.target === modal) {
                closeCreateLanceModal();
            }
        };

        // Load on page load
        loadLances();
    </script>
</body>
</html>
